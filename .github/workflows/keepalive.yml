name: Сайт на домене

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Проверить домен без изменения production
        run: |
          code=$(curl --connect-timeout 10 --max-time 30 -L -sS -o body.html -w "%{http_code}" "https://oblachko.team/?watchdog=$(date +%s)")
          echo "ответ: $code"
          if [ "$code" != "200" ] || ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' body.html; then
            echo "::error::oblachko.team отвечает $code; проверьте Pages и DNS вручную"
            exit 1
          fi
