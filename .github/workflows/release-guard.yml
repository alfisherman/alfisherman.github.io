name: Production release guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  release-guard:
    name: Release guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch proposed release without running its code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}"
      - name: Check release intent and file scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: refs/remotes/origin/pr-${{ github.event.pull_request.number }}
        run: node .github/scripts/check-release.mjs "$BASE_SHA" "$HEAD_REF"
